<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyProfile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <nav>
            <h1>MyProfile</h1>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#works">Works</a></li>
            </ul>
        </nav>
    </header>

    <!-- メインコンテンツ -->
    <main>
        <article>

            <!-- メインビジュアル -->
            <div class="main-visual">
                <img src="./images/camera.png" alt="カメラの写真">
            </div>

            <!-- About -->
            <section id="about">
                <h2>About</h2>

                <div class="profile">
                    <img src="./images/profile.png" alt="プロフィール写真">

                    <div class="profile-text">
                        <h3>Kazuki Asahina</h3>
                        <ul>
                            <li>25歳 長野県佐久市出身</li>
                            <li>ソフトウェア業界でマーケティングに従事</li>
                            <li>趣味はカメラ、愛機はCanon</li>
                            <li>自然を撮影するのが好きで、海や山によく行く</li>
                        </ul>
                    </div>
                </div>
            </section>

            <!-- Works -->
            <section id="works">
                <h2>Works</h2>

                <div class="works-list">
                    <div class="works-item">
                        <img src="./images/work1.png" alt="日本海の写真">
                        <p>新潟に訪れた際に、日本海の雄大さを魅了されて撮影した1枚</p>
                    </div>

                    <div class="works-item">
                        <img src="./images/work2.png" alt="雪山の写真">
                        <p>地元長野の木曽町から撮影した、冠雪した御嶽山</p>
                    </div>

                    <div class="works-item">
                        <img src="./images/work3.png" alt="京都の町並みの写真">
                        <p>京都で撮影した、明け方の古き良き日本の町並み</p>
                    </div>
                </div>
            </section>

        </article>
    </main>

    <!-- フッター -->
    <footer>
        <p>© MyProfile. All rights reserved.</p>
    </footer>

</body>
</html>
